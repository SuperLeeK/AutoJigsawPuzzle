name: 🧩 Generate Multiplayer Puzzle

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-puzzle:
    if: contains(github.event.issue.labels.*.name, 'puzzle-generator') || contains(github.event.issue.title, '[퍼즐생성]')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 저장소 체크아웃
        uses: actions/checkout@v4

      - name: ⚙️ Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: 📦 의존성 패키지 설치
        run: yarn install

      - name: 🌐 Playwright Chromium 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 🚀 퍼즐 생성 및 멀티플레이 링크 추출
        id: run-script
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node scripts/create_puzzle.js

      - name: 💬 이슈에 결과 댓글 작성 및 자동 완료(Close) 처리
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'result_comment.md';
            
            let commentBody = '⚠️ 알 수 없는 오류로 퍼즐 생성 결과가 작성되지 않았습니다.';
            if (fs.existsSync(path)) {
              commentBody = fs.readFileSync(path, 'utf8');
            }

            // 1. 이슈에 댓글 등록
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            // 2. 정상 완료 여부 확인 후 이슈 닫기
            if (fs.existsSync('result.json')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
